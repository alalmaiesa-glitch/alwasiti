name: alWasiti V1.4 production-hardening gate
on:
  push:
    branches: [hardening/v1.4]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node build.mjs
      - run: node tests/smoke.mjs
  chromium-acceptance:
    runs-on: ubuntu-latest
    needs: structural
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install browser, fonts and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-hosny-amiri fonts-noto-core
          python -m pip install --disable-pip-version-check playwright==1.55.0 lxml==6.0.1 Pillow==11.3.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Execute all 50 browser acceptance cases
        run: |
          export ALWASITI_TEST_FONT_AMIRI="$(find /usr/share/fonts -iname 'Amiri-Regular.ttf' -print -quit)"
          export ALWASITI_TEST_FONT_NOTO="$(find /usr/share/fonts -iname 'NotoKufiArabic-Regular.ttf' -print -quit)"
          test -s "$ALWASITI_TEST_FONT_AMIRI"
          test -s "$ALWASITI_TEST_FONT_NOTO"
          python tests/acceptance.py
          python tests/cross_browser.py
          node build.mjs
          python tests/self_hosted_fonts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v1-4-acceptance-results
          path: tests/ACCEPTANCE-RESULTS.json
          retention-days: 7
