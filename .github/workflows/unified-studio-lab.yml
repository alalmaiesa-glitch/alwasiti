name: alWasiti Unified Studio — isolated prototype gate
on:
  push:
    branches: [prototype/unified-arabic-studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate syntax and project model
        run: |
          node --check app/creative-studio/model.js
          node --check app/creative-studio/editor.js
          node tests/unified-model.mjs
      - name: Verify all release assets, including isolated studio
        run: |
          node build.mjs
          node tests/smoke.mjs
  real-browser:
    runs-on: ubuntu-latest
    needs: model-and-build
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Chromium browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate RTL editing, exports and local-only data
        run: python tests/unified-studio-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-studio-browser-proof
          path: /tmp/alwasiti-unified-studio.png
          if-no-files-found: ignore
          retention-days: 7
