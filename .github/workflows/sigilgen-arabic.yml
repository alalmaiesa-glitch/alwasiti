name: Sigilgen Arabic proof (not production)
on:
  push:
    branches: [spike/sigilgen-arabic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: xianshi3/sigilgen
          ref: 769499362cbc17e335443346337ebd85f38a29d9
          path: _sigilgen
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build pinned upstream in an isolated runner
        run: |
          npm --prefix _sigilgen install --ignore-scripts --no-audit --no-fund
          npm --prefix _sigilgen run build
      - name: Install Arabic font rendering tools in spike only
        run: npm --prefix spikes/sigilgen-arabic install --no-save --ignore-scripts --no-audit --no-fund fontkit@2.0.4 sharp@0.34.2
      - name: Test 10 Arabic names × 6 logos
        run: node spikes/sigilgen-arabic/prototype.mjs
      - name: Upload all 60 SVG + contact sheet + quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilgen-arabic-quality-samples
          path: spikes/sigilgen-arabic/output/
          retention-days: 7
